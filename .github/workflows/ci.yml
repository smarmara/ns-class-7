name: CI

# Validation only. This workflow never publishes anything — deployment lives in
# deploy-pages.yml and runs solely from the default branch.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
  schedule:
    # Weekly source sweep, so a change in Nova Scotia law or guidance is noticed
    # even during a quiet period with no pull requests.
    - cron: '17 9 * * 1'

# Least privilege: this workflow only ever reads the repository. It never
# deploys, never writes contents, never touches Pages and uses no secrets, so
# it needs nothing beyond read access. Stated explicitly rather than inherited
# from the repository default, which can be read/write — a compromised
# dependency or action in a CI run would otherwise hold a token that can push.
#
# Deployment lives in deploy-pages.yml, which runs only from `main` and is the
# only workflow holding `pages: write`. A pull request cannot reach it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        # Version comes from `packageManager` in package.json, so there is one
        # place to change it.
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # Frozen lockfile: a validation run must test the dependency tree the
        # repository actually declares, never a silently updated one.
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate content
        run: pnpm content:validate

      - name: Content quality
        run: pnpm content:quality

      - name: Syllabus coverage
        run: pnpm content:syllabus

      - name: Topic progression
        run: pnpm content:progression

      - name: Sign approvals
        run: pnpm signs:approval:check

      - name: Learner sign audit
        run: pnpm signs:learner-audit

      - name: Unit tests
        run: pnpm test

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: GitHub Pages subpath tests
        # Proves the app still works when mounted at /<repository>/ rather than
        # at the domain root — the failure mode a root-served preview hides.
        run: pnpm pages:test

      - name: Production build
        run: pnpm build

      - name: Offline audit
        run: pnpm native:offline:check

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  sources:
    name: Official source monitor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Never on a pull request.
    #
    # This job answers "has Nova Scotia changed something?" — a question about
    # the world, not about the change being proposed. Gating a pull request on
    # it was a category error: the regulations index tracks weekly petroleum
    # price orders and moves most days, so every open branch went red on a
    # schedule set by the Registrar of Regulations rather than by anything in
    # the branch. A gate that fires for reasons unrelated to the work is a gate
    # people learn to wave through, which is the opposite of what this one is
    # for.
    #
    # So it runs on the schedule and on demand, where a failure means exactly
    # one thing and there is no unrelated work waiting behind it. Deployment
    # already excludes it for a related reason (see deploy-pages.yml).
    if: github.event_name != 'pull_request'

    # Only to file the notice below. Nothing here ever writes to the repository
    # or accepts a source change.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check official sources for changes
        # Read-only by design. It never runs with --accept, so a change in
        # Nova Scotia source material fails loudly and waits for a human to
        # read the diff and decide what it means for the question bank.
        run: pnpm sources:check:ci

      - name: Upload source-change report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-check-report
          path: .sources/reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Open an issue when a source has moved
        # A failed scheduled run is an email that is easy to miss, and this is
        # the one signal the project cannot afford to lose: it is how a change
        # in Nova Scotia law reaches the question bank. An issue is a to-do that
        # stays visible until somebody closes it.
        #
        # Deliberately does not accept anything, quote any diff into the issue
        # body, or touch content. It says which sources moved and how to review
        # them; reading the diff and deciding what it means stays a human job.
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Official sources changed — review required"

          # Self-healing: the label may not exist yet in a fresh fork.
          gh label create source-monitor             --description "The official source monitor found a change to review"             --color D93F0B 2>/dev/null || true

          # One open issue at a time: reopening the same thread each fortnight
          # beats accumulating a pile of identical ones.
          EXISTING=$(gh issue list --state open --label source-monitor \
            --json number --jq '.[0].number // empty')

          BODY=$(cat <<'EOF'
          The scheduled source monitor found at least one official source that no
          longer matches its recorded snapshot.

          **Nothing has been accepted and no question has been changed.** This is a
          prompt to review, not a failure of the app.

          To triage locally:

          ```bash
          pnpm sources:check          # writes a full diff report to .sources/reports/
          ```

          Read the diff and decide what actually moved:

          - If a rule this app teaches has changed, set the affected questions to
            `legalStatus: "under_review"` with a `reviewReason` and re-verify each
            against the new text.
          - If it is cosmetic — site chrome, a new regulation under an unrelated
            Act — record why in the manifest notes, bump `verifiedAt`, and then
            `pnpm sources:check --accept`.

          The full report is attached to the workflow run as an artifact.
          EOF
          )
          BODY="${BODY}"$'\n\n'"Run: ${RUN_URL}"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on existing issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --label source-monitor --body "$BODY"
          fi
