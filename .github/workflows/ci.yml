name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CI: true
  NODE_VERSION: 22
  PNPM_VERSION: 10.17.1

jobs:
  check:
    name: Lint, validate, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate content
        run: pnpm content:validate

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check official sources
        # Fetches every monitored government source and fails the build if any
        # has changed (or could not be fetched). A change here is a signal for
        # a maintainer to review the diff report — never auto-promoted content.
        run: pnpm sources:check:ci

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7